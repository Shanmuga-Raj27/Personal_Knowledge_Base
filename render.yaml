services:
  # Backend web service — builds from existing backend/Dockerfile
  - type: web
    name: pkb-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VITE_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-003
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: document_vault
      - key: QDRANT_RAG_COLLECTION_NAME
        value: document_chunks_v1
      - key: QDRANT_DISTANCE
        value: COSINE
      - key: RAG_CACHE_ENABLED
        value: true
      - key: RAG_CACHE_TTL_SECONDS
        value: 86400
      - key: RAG_DEFAULT_TOP_K
        value: 6
      - key: EMBEDDING_DIMENSIONS
        value: 768

  # MySQL as a private Docker service (Blueprints don't support MySQL natively)
  - type: pserv
    name: pkb-mysql
    runtime: docker
    image:
      url: mysql:8.0
    plan: starter
    region: oregon
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 5
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: personal_knowledge_base
      - key: MYSQL_USER
        value: pkb
      - key: MYSQL_PASSWORD
        sync: false

  # Qdrant as a private Docker service
  - type: pserv
    name: pkb-qdrant
    runtime: docker
    image:
      url: qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5

  # Redis via Render Key Value (managed)
  - type: keyvalue
    name: pkb-redis
    plan: 256mb
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: same-workspace

cron:
  - name: pkb-migrate
    command: alembic upgrade head
    service: pkb-backend
    schedule: "0 0 * * *"
    type: cron
    region: oregon
