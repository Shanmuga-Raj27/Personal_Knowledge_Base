services:
  # ── Backend web service ──────────────────────────────────────────
  # Builds from the existing backend/Dockerfile on every git push to main.
  # No main project source code files are modified.
  - type: web
    name: pkb-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    envVars:
      # Database URL — hostname comes from the MySQL private service below.
      # Password is a static value defined in the MySQL service env vars.
      - key: DATABASE_URL
        fromService:
          name: pkb-mysql
          type: pserv
          envVarKey: DATABASE_URL
      # Redis — set manually in the Render Dashboard after Key Value is created.
      - key: REDIS_URL
        sync: false
      # Qdrant — hostname comes from the Qdrant private service below.
      - key: QDRANT_HOST
        fromService:
          name: pkb-qdrant
          type: pserv
          envVarKey: QDRANT_HOST
      # Core app secret (auto-generated by Render).
      - key: SECRET_KEY
        generateValue: true
      # Filled in after first deploy.
      - key: VITE_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Backblaze B2 (filled in after first deploy).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-003
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      # Gemini (filled in after first deploy).
      - key: GEMINI_API_KEY
        sync: false
      # Qdrant collection + RAG defaults (match others/.env.example).
      - key: QDRANT_COLLECTION_NAME
        value: document_vault
      - key: QDRANT_RAG_COLLECTION_NAME
        value: document_chunks_v1
      - key: QDRANT_DISTANCE
        value: COSINE
      # RAG tuning defaults.
      - key: RAG_CACHE_ENABLED
        value: true
      - key: RAG_CACHE_TTL_SECONDS
        value: 86400
      - key: RAG_DEFAULT_TOP_K
        value: 6
      - key: EMBEDDING_DIMENSIONS
        value: 768

  # ── MySQL as a private Docker service ────────────────────────────
  # Render Blueprints do NOT support MySQL databases natively.
  # We run the official mysql:8.0 image as a private service instead.
  - type: pserv
    name: pkb-mysql
    runtime: docker
    image: mysql:8.0
    plan: starter
    region: oregon
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 5
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: pkb_mysql_root_2024
      - key: MYSQL_DATABASE
        value: personal_knowledge_base
      - key: MYSQL_USER
        value: pkb
      - key: MYSQL_PASSWORD
        value: pkb_mysql_root_2024
      # Expose the full connection string for the backend service to reference.
      - key: DATABASE_URL
        value: mysql+pymysql://pkb:pkb_mysql_root_2024@pkb-mysql:3306/personal_knowledge_base

  # ── Qdrant as a private Docker service ───────────────────────────
  - type: pserv
    name: pkb-qdrant
    runtime: docker
    image: qdrant/qdrant:latest
    plan: starter
    region: oregon
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 5
    envVars:
      # Expose the Qdrant URL for the backend service to reference.
      - key: QDRANT_HOST
        value: http://pkb-qdrant:6333

  # ── Redis via Render Key Value (managed) ─────────────────────────
  # Render does not support Redis in the Blueprint `databases` section.
  # Key Value instances are the correct way to get Redis on Render.
  - type: keyvalue
    name: pkb-redis
    plan: 256mb
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: same-workspace-services

cronJobs:
  # ── Alembic migration cron job ───────────────────────────────────
  # Runs `alembic upgrade head` inside the backend container daily.
  # Run it manually (click "Run Now" in the dashboard) right after
  # the first deploy.
  - name: pkb-migrate
    command: alembic upgrade head
    service: pkb-backend
    schedule: "0 0 * * *"
    type: cron
    region: oregon
